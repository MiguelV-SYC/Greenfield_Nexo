# Infra local de Nexo (stack/tech-stack.md § Infra local).
# Uso: `podman compose up -d` (o `docker compose up -d`) con un `.env`
# copiado de `.env.example` en la raíz del repo.
name: nexo

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      NEXO_MIGRADOR_PASSWORD: ${NEXO_MIGRADOR_PASSWORD:?definir NEXO_MIGRADOR_PASSWORD en .env}
      NEXO_APP_PASSWORD: ${NEXO_APP_PASSWORD:?definir NEXO_APP_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Documentos legales (DEC-3). Las imágenes oficiales de MinIO ya no se
  # publican; esta es la última compilación de Bitnami (sin actualizaciones de
  # seguridad): solo para desarrollo local. Ver infra/README.md.
  minio:
    image: docker.io/bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir MINIO_ROOT_PASSWORD en .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-datos:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Una sola vez tras levantar MinIO: buckets con Object Lock, retención de 20
  # años y el usuario de la aplicación (infra/minio/preparar.sh).
  minio-preparar:
    image: docker.io/bitnamilegacy/minio:2025.7.23
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/preparar/preparar.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?definir MINIO_APP_ACCESS_KEY en .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?definir MINIO_APP_SECRET_KEY en .env}
      MINIO_BUCKETS: nexo-documentos nexo-documentos-pruebas
      # Podman copia el proxy del host al contenedor; MinIO es local.
      NO_PROXY: minio
      no_proxy: minio
    volumes:
      - ./infra/minio:/preparar:ro,z

volumes:
  postgres-datos:
  minio-datos:
